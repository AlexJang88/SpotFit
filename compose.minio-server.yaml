# Use this override when the developer PC targets the Ubuntu MinIO over the LAN.
services:
  backend:
    environment:
      S3_ENDPOINT_URL: ${DEV_S3_ENDPOINT_URL:?Set DEV_S3_ENDPOINT_URL in .env}
      AWS_ACCESS_KEY_ID: ${DEV_S3_ACCESS_KEY_ID:?Set DEV_S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${DEV_S3_SECRET_ACCESS_KEY:?Set DEV_S3_SECRET_ACCESS_KEY in .env}
      S3_MODEL_BUCKET: ${DEV_S3_MODEL_BUCKET:-spot-fit-models}
  model-tools:
    environment:
      S3_ENDPOINT_URL: ${DEV_S3_ENDPOINT_URL:?Set DEV_S3_ENDPOINT_URL in .env}
      AWS_ACCESS_KEY_ID: ${DEV_S3_ACCESS_KEY_ID:?Set DEV_S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${DEV_S3_SECRET_ACCESS_KEY:?Set DEV_S3_SECRET_ACCESS_KEY in .env}
      S3_MODEL_BUCKET: ${DEV_S3_MODEL_BUCKET:-spot-fit-models}
