# Ubuntu server overrides. Use together with compose.yaml on the Ubuntu VM.
services:
  nginx:
    restart: unless-stopped
  frontend:
    restart: unless-stopped
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
  postgres:
    restart: unless-stopped
  minio:
    restart: unless-stopped
  tracking-db-init:
    restart: "no"
  mlflow-init:
    restart: "no"
  airflow:
    restart: unless-stopped
  mlflow:
    restart: unless-stopped
  model-tools:
    restart: "no"
