# Developer workstation: run only the app and connect to Ubuntu infrastructure.
name: spot_fit_dev

services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      WATCH_USE_POLLING: ${WATCH_USE_POLLING:-true}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?Set S3_ENDPOINT_URL in .env.dev}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env.dev}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env.dev}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_MODEL_BUCKET: ${S3_MODEL_BUCKET:-spot-fit-models}
      MODEL_REGISTRY_DIR: /model_registry
      POSTGRES_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST in .env.dev}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.dev}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.dev}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://192.168.0.3:5000}
      WATCHFILES_FORCE_POLLING: ${WATCH_USE_POLLING:-true}
      MODEL_CACHE_DIR: /model-cache
    volumes:
      - ./backend:/app
      - ./artifacts:/artifacts:ro
      - ./model_registry:/model_registry:ro
      - dev_model_cache:/model-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/spot_fit')"]
      interval: 10s
      timeout: 5s
      retries: 5

  model-tools:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    entrypoint: ["python", "-m", "app.cli.models"]
    environment:
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?Set S3_ENDPOINT_URL in .env.dev}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env.dev}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env.dev}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_MODEL_BUCKET: ${S3_MODEL_BUCKET:-spot-fit-models}
      MODEL_REGISTRY_DIR: /model_registry
      MODEL_CACHE_DIR: /artifacts/models
    volumes:
      - ./backend:/app
      - ./artifacts:/artifacts
      - ./model_registry:/model_registry

volumes:
  frontend_node_modules:
  dev_model_cache:


