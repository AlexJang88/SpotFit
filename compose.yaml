# Development environment. See docs/deployment.md before Linux production deployment.
name: spot_fit

x-model-storage: &model-storage
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_MODEL_BUCKET: ${S3_MODEL_BUCKET:-spot-fit-models}
  MODEL_REGISTRY_DIR: /model_registry

services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      WATCH_USE_POLLING: ${WATCH_USE_POLLING:-true}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      <<: *model-storage
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-spot_fit}
      POSTGRES_USER: ${POSTGRES_USER:-spot_fit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      MODEL_CACHE_DIR: /model-cache
      WATCHFILES_FORCE_POLLING: ${WATCH_USE_POLLING:-true}
    volumes:
      - ./backend:/app
      - ./artifacts:/artifacts:ro
      - ./model_registry:/model_registry:ro
      - model_cache:/model-cache
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/spot_fit')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spot_fit}
      POSTGRES_USER: ${POSTGRES_USER:-spot_fit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    build: ./infra/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Copy .env.example to .env first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "${MINIO_API_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  tracking-db-init:
    image: postgis/postgis:17-3.5-alpine
    entrypoint: ["sh", "-c"]
    command:
      - >-
        set -eu;
        for database in airflow mlflow; do
          exists=$$(psql -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc "SELECT 1 FROM pg_database WHERE datname = '$$database'");
          if [ "$$exists" != "1" ]; then
            createdb -h postgres -U "$$POSTGRES_USER" -O "$$POSTGRES_USER" "$$database";
          fi;
        done
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spot_fit}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-spot_fit}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow:
    build:
      context: .
      dockerfile: infra/airflow/Dockerfile
    command: standalone
    environment: &airflow-environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-spot_fit}:${POSTGRES_PASSWORD:?Copy .env.example to .env first}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in .env}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?Set AIRFLOW_SECRET_KEY in .env}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:-spotfit}:admin
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PYTHONPATH: /opt/spot_fit
    volumes:
      - ./infra/airflow/dags:/opt/airflow/dags:ro
      - ./ml:/opt/spot_fit/ml:ro
      - airflow_logs:/opt/airflow/logs
      - airflow_home:/opt/airflow
    ports:
      - "${AIRFLOW_BIND_ADDRESS:-127.0.0.1}:${AIRFLOW_PORT:-8081}:8080"
    depends_on:
      tracking-db-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mlflow-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    entrypoint: ["python", "/infra/mlflow/init_bucket.py"]
    environment:
      <<: *model-storage
      MINIO_ENDPOINT: minio:9000
      MLFLOW_ARTIFACT_BUCKET: ${MLFLOW_ARTIFACT_BUCKET:-spot-fit-mlflow}
    volumes:
      - ./infra/mlflow/init_bucket.py:/infra/mlflow/init_bucket.py:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql+psycopg2://${POSTGRES_USER:-spot_fit}:${POSTGRES_PASSWORD:?Copy .env.example to .env first}@postgres:5432/mlflow
      - --artifacts-destination
      - s3://${MLFLOW_ARTIFACT_BUCKET:-spot-fit-mlflow}
    environment:
      <<: *model-storage
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "${MLFLOW_BIND_ADDRESS:-127.0.0.1}:${MLFLOW_PORT:-5000}:5000"
    depends_on:
      tracking-db-init:
        condition: service_completed_successfully
      mlflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  model-tools:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    entrypoint: ["python", "-m", "app.cli.models"]
    environment:
      <<: *model-storage
      MODEL_CACHE_DIR: /artifacts/models
    volumes:
      - ./backend:/app
      - ./artifacts:/artifacts
      - ./model_registry:/model_registry
    depends_on:
      minio:
        condition: service_healthy

  minio-dev-bootstrap:
    profiles: ["admin"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    entrypoint: ["python", "/infra/minio/bootstrap_dev_identity.py"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      DEV_S3_MODEL_BUCKET: ${DEV_S3_MODEL_BUCKET:-spot-fit-models}
      DEV_S3_ACCESS_KEY_ID: ${DEV_S3_ACCESS_KEY_ID:-}
      DEV_S3_SECRET_ACCESS_KEY: ${DEV_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - ./infra/minio/bootstrap_dev_identity.py:/infra/minio/bootstrap_dev_identity.py:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  frontend_node_modules:
  postgres_data:
  minio_data:
  model_cache:
  airflow_logs:
  airflow_home:
